<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 簡約學習編輯器</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CodeMirror 核心與樣式（提供自動顏色高亮與行號） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <style>
        /* 讓 CodeMirror 充滿左側區域 */
        .CodeMirror {
            height: 100%;
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        
        /* 淺色主題微調 */
        .cm-s-default .CodeMirror-gutters {
            background-color: #f1f5f9;
            border-right: 1px solid #e2e8f0;
        }

        /* 深色主題微調 */
        .cm-s-dracula .CodeMirror-gutters {
            background-color: #1e293b;
            border-right: 1px solid #334155;
        }
    </style>
</head>
<body id="appBody" class="bg-slate-100 text-slate-800 font-sans h-full flex flex-col overflow-hidden transition-colors duration-200">

    <!-- 頂部功能列 -->
    <header id="appHeader" class="h-14 bg-white border-b border-slate-200 px-5 flex items-center justify-between flex-shrink-0 transition-colors duration-200 shadow-sm">
        <!-- 標題 -->
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold shadow-sm">
                <i class="fa-solid fa-code"></i>
            </div>
            <h1 class="font-bold text-base tracking-wide flex items-center gap-2">
                HTML 學習編輯器
            </h1>
        </div>

        <!-- 操作按鈕區 -->
        <div class="flex items-center space-x-3">
            <!-- 實作範例庫下拉選單 -->
            <div class="flex items-center gap-2">
                <label for="exampleSelect" class="text-xs font-medium text-slate-600 dark:text-slate-300 hidden md:inline-block">
                    <i class="fa-solid fa-folder-open text-amber-500 mr-1"></i>實作範例庫：
                </label>
                <select id="exampleSelect" onchange="onSelectExample(this.value)" class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer font-medium transition">
                    <option value="">-- 請選擇實作範例 --</option>
                    <option value="01_hello.html">01_hello.html</option>
                    <option value="02_hello.html">02_hello.html</option>
                    <option value="03_hello.html">03_hello.html</option>
                    <option value="04_heading.html">04_heading.html</option>
                    <option value="05_school.html">05_school.html</option>
                    <option value="06_no-tag.html">06_no-tag.html</option>
                    <option value="07_comment.html">07_comment.html</option>
                    <option value="08_other-text.html">08_other-text.html</option>
                    <option value="09_text.html">09_text.html</option>
                    <option value="10_attribute.html">10_attribute.html</option>
                    <option value="11_common-style copy.html">11_common-style copy.html</option>
                    <option value="12_two-properties.html">12_two-properties.html</option>
                    <option value="13_two-styles.html">13_two-styles.html</option>
                    <option value="14_image-pikachu.html">14_image-pikachu.html</option>
                    <option value="15_image-pikachu2.html">15_image-pikachu2.html</option>
                    <option value="16_hyperlink.html">16_hyperlink.html</option>
                    <option value="17_city.html">17_city.html</option>
                </select>
            </div>

            <!-- 切換深/淺色模式按鈕 -->
            <button id="themeToggleBtn" onclick="toggleTheme()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-200 text-xs px-3.5 py-2 rounded-lg flex items-center gap-2 transition font-medium border border-slate-300 dark:border-slate-700">
                <i id="themeIcon" class="fa-solid fa-moon text-indigo-500"></i>
                <span id="themeText">切換深色</span>
            </button>

            <!-- 儲存網頁檔 .html -->
            <button onclick="downloadHTML()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg flex items-center gap-2 font-medium transition shadow-sm">
                <i class="fa-solid fa-download"></i> 儲存網頁檔 (.html)
            </button>
        </div>
    </header>

    <!-- 主要畫面：左邊編輯、右邊預覽 -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- 左欄：程式碼編輯區 (含行數與高亮) -->
        <section id="leftPanel" class="w-1/2 h-full flex flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 transition-colors duration-200">
            <div id="editorBar" class="h-8 px-4 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 font-mono transition-colors duration-200">
                <span class="flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-blue-500"></i> HTML 程式碼編輯器
                </span>
            </div>
            <div class="flex-1 relative overflow-hidden">
                <textarea id="codeEditor"></textarea>
            </div>
        </section>

        <!-- 右欄：即時網頁畫面 -->
        <section id="rightPanel" class="w-1/2 h-full flex flex-col bg-slate-100 dark:bg-slate-950 transition-colors duration-200">
            <div id="previewBar" class="h-8 px-4 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 font-mono transition-colors duration-200">
                <span class="flex items-center gap-2">
                    <i class="fa-solid fa-eye text-emerald-500"></i> 即時畫面預覽
                </span>
                <span class="text-xs text-emerald-600 dark:text-emerald-400 flex items-center gap-1.5 font-sans">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 即時同步中
                </span>
            </div>
            <div class="flex-1 bg-white relative overflow-hidden">
                <iframe id="previewFrame" class="w-full h-full border-none bg-white"></iframe>
            </div>
        </section>

    </main>

    <!-- 提示通知彈窗 (不使用 alert) -->
    <div id="toast" class="hidden fixed bottom-4 right-4 text-xs px-4 py-3 rounded-lg shadow-xl z-50 transition-all flex items-center gap-2 border"></div>

    <script>
        // 預設基礎 HTML 範本
        const DEFAULT_CODE = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>我的網頁</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f8fafc;
      text-align: center;
      padding-top: 50px;
    }
    h1 {
      color: #2563eb;
    }
    p {
      color: #475569;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h1>Hello World! 👋</h1>
  <p>這是我的第一個網頁程式碼！</p>

</body>
</html>`;

        let editor;
        let isDarkMode = false;

        window.onload = function() {
            // 初始化 CodeMirror 編輯器 (具備行號與自動語法高亮)
            editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
                mode: 'htmlmixed',
                theme: 'default',
                lineNumbers: true, // 顯示行數
                lineWrapping: true,
                tabSize: 2
            });

            // 設定預設程式碼
            editor.setValue(DEFAULT_CODE);

            // 當編輯內容改變時，即時更新右側預覽
            editor.on('change', function() {
                updatePreview();
            });

            // 初次渲染預覽
            updatePreview();
        };

        // 載入實作範例檔 (.html)
        async function onSelectExample(fileName) {
            if (!fileName) return;

            try {
                const safeFileName = encodeURI(fileName);
                const response = await fetch(safeFileName);
                if (!response.ok) {
                    throw new Error(`無法讀取檔案 (${response.status})`);
                }
                const code = await response.text();
                editor.setValue(code);
                showToast(`已成功載入範例「${fileName}」`);
            } catch (err) {
                console.error(err);
                showToast(`無法載入 ${fileName}。如果是本機瀏覽 (file://)，請上傳至 GitHub Pages 開啟。`, true);
            }
        }

        // 顯示提示訊息
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = `fixed bottom-4 right-4 text-xs px-4 py-3 rounded-lg shadow-xl z-50 transition-all flex items-center gap-2 border ${
                isError 
                    ? 'bg-red-900/90 text-red-100 border-red-700 backdrop-blur-sm' 
                    : 'bg-slate-800/90 text-white border-slate-700 backdrop-blur-sm'
            }`;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 4000);
        }

        // 即時更新右側 iframe 畫面
        function updatePreview() {
            const code = editor.getValue();
            const frame = document.getElementById('previewFrame');
            const frameDoc = frame.contentDocument || frame.contentWindow.document;
            frameDoc.open();
            frameDoc.write(code);
            frameDoc.close();
        }

        // 下載 HTML 檔案
        function downloadHTML() {
            const code = editor.getValue();
            const blob = new Blob([code], { type: 'text/html;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 切換深色與淺色模式
        function toggleTheme() {
            isDarkMode = !isDarkMode;

            const body = document.getElementById('appBody');
            const header = document.getElementById('appHeader');
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            const leftPanel = document.getElementById('leftPanel');
            const rightPanel = document.getElementById('rightPanel');
            const editorBar = document.getElementById('editorBar');
            const previewBar = document.getElementById('previewBar');

            if (isDarkMode) {
                // 套用深色模式 (Dark Mode)
                body.classList.remove('bg-slate-100', 'text-slate-800');
                body.classList.add('bg-slate-950', 'text-slate-100', 'dark');
                
                header.classList.remove('bg-white', 'border-slate-200');
                header.classList.add('bg-slate-900', 'border-slate-800');

                editorBar.classList.remove('bg-slate-50', 'border-slate-200');
                editorBar.classList.add('bg-slate-900', 'border-slate-800');

                previewBar.classList.remove('bg-slate-50', 'border-slate-200');
                previewBar.classList.add('bg-slate-900', 'border-slate-800');

                themeIcon.className = 'fa-solid fa-sun text-amber-400';
                themeText.textContent = '切換淺色';

                // CodeMirror 切換為 Dracula 深色主題
                editor.setOption('theme', 'dracula');
            } else {
                // 套用淺色模式 (Light Mode)
                body.classList.remove('bg-slate-950', 'text-slate-100', 'dark');
                body.classList.add('bg-slate-100', 'text-slate-800');
                
                header.classList.remove('bg-slate-900', 'border-slate-800');
                header.classList.add('bg-white', 'border-slate-200');

                editorBar.classList.remove('bg-slate-900', 'border-slate-800');
                editorBar.classList.add('bg-slate-50', 'border-slate-200');

                previewBar.classList.remove('bg-slate-900', 'border-slate-800');
                previewBar.classList.add('bg-slate-50', 'border-slate-200');

                themeIcon.className = 'fa-solid fa-moon text-indigo-500';
                themeText.textContent = '切換深色';

                // CodeMirror 切換為 Default 淺色主題
                editor.setOption('theme', 'default');
            }
        }
    </script>
</body>
</html>
